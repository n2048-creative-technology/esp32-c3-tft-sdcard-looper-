; XIAO ESP32-C3 driving a 1.8" 128x160 SPI TFT (ST7735 controller)
; Wiring: see README.md

[env:xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; allow // and /* */ comments in config.json
    -D ARDUINOJSON_ENABLE_COMMENTS=1
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
    adafruit/Adafruit GFX Library@^1.11.11
    bitbank2/JPEGDEC@^1.8.5
    bblanchon/ArduinoJson@^7.4.3
    ; ST7735 lib depends on "SD"; satisfy it with the ESP32 core SD, not the AVR-only registry one
    SD=symlink://${platformio.packages_dir}/framework-arduinoespressif32/libraries/SD
lib_ignore =
    bb_spi_lcd   ; pulled in by JPEGDEC, not needed
